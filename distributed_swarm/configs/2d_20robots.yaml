env:
  num_agents: 20
  map_size: 45
  max_episode_steps: 450
  robot_radius: 0.35
  collision_radius: 0.7
  goal_radius: 4.0
  communication_radius: 16.0
  obstacle_sensor_radius: 10.0
  network:
    packet_loss: 0.1
    min_delay: 0
    max_delay: 2
    reorder: true
  consistency:
    mode: confidence
    lambda_decay: 0.25
    logical_clocks: true
    predict_position: false
    failure_detection: true
    heartbeat_interval: 1
    heartbeat_timeout: 4
    unavailable_timeout: 8
training:
  training_mode: independent
  total_timesteps: 10000000
  num_envs: 16
  num_steps: 128
  update_epochs: 4
  num_minibatches: 8
  learning_rate: 0.0003
  ent_coef: 0.01
