[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-swarm"
version = "0.1.0"
description = "Fault-tolerant decentralized robot coordination experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=1.1,<2", "torch>=2.2", "PyYAML>=6", "tensorboard>=2.16", "pygame>=2.5", "mujoco>=3.2,<4", "matplotlib>=3.8", "imageio[ffmpeg]>=2.34"]

[project.optional-dependencies]
test = ["pytest>=8"]
tracking = ["wandb>=0.17"]

[tool.setuptools.packages.find]
include = ["distributed_swarm*"]

[tool.setuptools.package-data]
distributed_swarm = ["configs/*.yaml", "envs/*.xml", "scripts/*.sh"]

[tool.pytest.ini_options]
testpaths = ["distributed_swarm/tests"]
